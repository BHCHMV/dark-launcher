plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bhchmv.darklauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bhchmv.darklauncher'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Dedicated signing key for this app only, kept in the repo so every
    // build can install over the previous one without uninstalling.
    signingConfigs {
        shared {
            storeFile file('../keystore/darklauncher.jks')
            storePassword 'darklauncher'
            keyAlias 'darklauncher'
            keyPassword 'darklauncher'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
